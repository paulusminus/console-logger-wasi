[package]
description = "This wasm component writes log messages to the console. It implements the wasi:logging/logging interface."
edition = "2024"
license = "MIT"
name = "console-logger-wasi"
repository = "https://github.com/paulusminus/console-logger-wasi"
version = "0.1.2"

[lib]
crate-type = ["cdylib"]

[profile.release]
strip = true
lto = true
codegen-units = 1
panic = "abort"
opt-level = "s"

[dependencies]
humantime = "2.4.0"
wit-bindgen = { version = "0.60.0", features = ["async-spawn"] }
